<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡易待辦事項</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: #f5f5f7;
    margin: 0;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 24px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 16px;
    color: #222;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .input-row input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
  }
  .option-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .option-row select,
  .option-row input[type="date"] {
    flex: 1;
    min-width: 140px;
    padding: 8px 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    color: #222;
    font-family: inherit;
  }
  .cat-icon {
    font-size: 18px;
    line-height: 1;
    flex-shrink: 0;
  }
  .todo-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .due-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    align-self: flex-start;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #f0f0f3;
    color: #666;
  }
  .due-badge.today { background: #fef3c7; color: #b45309; }
  .due-badge.overdue { background: #fee2e2; color: #b91c1c; }
  li.done .due-badge { background: #f0f0f3; color: #aaa; }
  .input-row button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  .input-row button:hover { background: #1d4ed8; }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid #eee;
  }
  li:last-child { border-bottom: none; }
  li .todo-text {
    font-size: 15px;
    word-break: break-word;
  }
  li.done .todo-text {
    text-decoration: line-through;
    color: #999;
  }
  li button.delete-btn {
    border: none;
    background: transparent;
    color: #d33;
    font-size: 14px;
    cursor: pointer;
    padding: 4px 8px;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    font-size: 13px;
    color: #888;
  }
  .footer button {
    border: none;
    background: transparent;
    color: #2563eb;
    cursor: pointer;
    font-size: 13px;
  }
  .empty {
    text-align: center;
    color: #aaa;
    font-size: 14px;
    padding: 24px 0;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>待辦事項</h1>
    <div class="input-row">
      <input id="todo-input" type="text" placeholder="輸入待辦事項，按 Enter 新增">
      <button id="add-btn">新增</button>
    </div>
    <div class="option-row">
      <select id="category-select" title="分類"></select>
      <input id="due-input" type="date" title="到期日">
    </div>
    <ul id="todo-list"></ul>
    <div id="empty-hint" class="empty" style="display:none;">目前沒有待辦事項</div>
    <div class="footer">
      <span id="count-text">共 0 項</span>
      <button id="clear-done-btn">清除已完成</button>
    </div>
  </div>

<script>
  const STORAGE_KEY = 'todo-items';

  const CATEGORIES = [
    { id: 'other',    icon: '📌', label: '其他' },
    { id: 'work',     icon: '💼', label: '工作' },
    { id: 'personal', icon: '🏠', label: '個人' },
    { id: 'shopping', icon: '🛒', label: '購物' },
    { id: 'health',   icon: '💪', label: '健康' },
    { id: 'study',    icon: '📚', label: '學習' },
  ];
  const DEFAULT_CATEGORY = 'other';

  function getCategory(id) {
    return CATEGORIES.find(c => c.id === id) || CATEGORIES[0];
  }

  function todayStr() {
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${d.getFullYear()}-${m}-${day}`;
  }

  // 回傳 'overdue' | 'today' | 'upcoming'
  function dueStatus(dueDate) {
    const today = todayStr();
    if (dueDate < today) return 'overdue';
    if (dueDate === today) return 'today';
    return 'upcoming';
  }

  function formatDue(dueDate) {
    const [y, m, d] = dueDate.split('-');
    const status = dueStatus(dueDate);
    const base = `${Number(m)}/${Number(d)}`;
    if (status === 'today') return `今天 ${base}`;
    if (status === 'overdue') return `已過期 ${base}`;
    return `${y}/${base}`;
  }

  function loadTodos() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveTodos(todos) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    } catch (e) {
      // 部分環境（如以 data: 網址開啟）禁止使用 localStorage，此時僅維持記憶體中的資料
    }
  }

  let todos = loadTodos();

  const listEl = document.getElementById('todo-list');
  const inputEl = document.getElementById('todo-input');
  const addBtn = document.getElementById('add-btn');
  const emptyHint = document.getElementById('empty-hint');
  const countText = document.getElementById('count-text');
  const clearDoneBtn = document.getElementById('clear-done-btn');
  const categorySelect = document.getElementById('category-select');
  const dueInput = document.getElementById('due-input');

  CATEGORIES.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = `${c.icon} ${c.label}`;
    categorySelect.appendChild(opt);
  });
  categorySelect.value = DEFAULT_CATEGORY;

  function render() {
    listEl.innerHTML = '';
    emptyHint.style.display = todos.length === 0 ? 'block' : 'none';

    todos.forEach(todo => {
      const li = document.createElement('li');
      if (todo.done) li.classList.add('done');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = todo.done;
      checkbox.addEventListener('change', () => toggleTodo(todo.id));

      const cat = getCategory(todo.category);
      const iconEl = document.createElement('span');
      iconEl.className = 'cat-icon';
      iconEl.textContent = cat.icon;
      iconEl.title = cat.label;

      const main = document.createElement('div');
      main.className = 'todo-main';

      const span = document.createElement('span');
      span.className = 'todo-text';
      span.textContent = todo.text;
      main.appendChild(span);

      if (todo.dueDate) {
        const badge = document.createElement('span');
        badge.className = 'due-badge';
        if (!todo.done) badge.classList.add(dueStatus(todo.dueDate));
        badge.textContent = `📅 ${formatDue(todo.dueDate)}`;
        main.appendChild(badge);
      }

      const delBtn = document.createElement('button');
      delBtn.textContent = '刪除';
      delBtn.className = 'delete-btn';
      delBtn.addEventListener('click', () => deleteTodo(todo.id));

      li.appendChild(checkbox);
      li.appendChild(iconEl);
      li.appendChild(main);
      li.appendChild(delBtn);
      listEl.appendChild(li);
    });

    const doneCount = todos.filter(t => t.done).length;
    countText.textContent = `共 ${todos.length} 項，已完成 ${doneCount} 項`;
  }

  function addTodo() {
    const text = inputEl.value.trim();
    if (!text) return;
    todos.push({
      id: Date.now(),
      text,
      done: false,
      category: categorySelect.value || DEFAULT_CATEGORY,
      dueDate: dueInput.value || null,
    });
    inputEl.value = '';
    dueInput.value = '';
    saveTodos(todos);
    render();
  }

  function toggleTodo(id) {
    const todo = todos.find(t => t.id === id);
    if (todo) todo.done = !todo.done;
    saveTodos(todos);
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    saveTodos(todos);
    render();
  }

  function clearDone() {
    todos = todos.filter(t => !t.done);
    saveTodos(todos);
    render();
  }

  addBtn.addEventListener('click', addTodo);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTodo();
  });
  dueInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTodo();
  });
  clearDoneBtn.addEventListener('click', clearDone);

  render();
</script>
</body>
</html>
