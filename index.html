<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡易待辦事項</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: #f5f5f7;
    margin: 0;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 520px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 24px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 16px;
    color: #222;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .input-row input {
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    min-width: 0;
  }
  .input-row #todo-input { flex: 1 1 200px; }
  .input-row #owner-input { flex: 0 1 120px; }
  .input-row button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  .input-row button:hover { background: #1d4ed8; }
  .filter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 13px;
    color: #666;
  }
  .filter-row select {
    padding: 6px 8px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 13px;
    background: #fff;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid #eee;
  }
  li:last-child { border-bottom: none; }
  li span.text {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
  }
  li.done span.text {
    text-decoration: line-through;
    color: #999;
  }
  li .owner-badge {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #e0ecff;
    color: #1d4ed8;
    white-space: nowrap;
    cursor: pointer;
    border: none;
    font-family: inherit;
  }
  li .owner-badge.unassigned {
    background: #f0f0f0;
    color: #888;
  }
  li .owner-badge:hover { filter: brightness(0.95); }
  li button.delete-btn {
    border: none;
    background: transparent;
    color: #d33;
    font-size: 14px;
    cursor: pointer;
    padding: 4px 8px;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    font-size: 13px;
    color: #888;
  }
  .footer button {
    border: none;
    background: transparent;
    color: #2563eb;
    cursor: pointer;
    font-size: 13px;
  }
  .empty {
    text-align: center;
    color: #aaa;
    font-size: 14px;
    padding: 24px 0;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>待辦事項</h1>
    <div class="input-row">
      <input id="todo-input" type="text" placeholder="輸入待辦事項，按 Enter 新增">
      <input id="owner-input" type="text" placeholder="負責人" title="選填" list="owner-suggestions">
      <datalist id="owner-suggestions"></datalist>
      <button id="add-btn">新增</button>
    </div>
    <div class="filter-row">
      <label for="owner-filter">負責人篩選：</label>
      <select id="owner-filter">
        <option value="">全部</option>
      </select>
    </div>
    <ul id="todo-list"></ul>
    <div id="empty-hint" class="empty" style="display:none;">目前沒有待辦事項</div>
    <div class="footer">
      <span id="count-text">共 0 項</span>
      <button id="clear-done-btn">清除已完成</button>
    </div>
  </div>

<script>
  const STORAGE_KEY = 'todo-items';
  const UNASSIGNED = '未指定';

  function loadTodos() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const list = raw ? JSON.parse(raw) : [];
      // 舊資料沒有 owner 欄位，補上空字串以維持相容
      return list.map(t => ({ ...t, owner: typeof t.owner === 'string' ? t.owner : '' }));
    } catch (e) {
      return [];
    }
  }

  function saveTodos(todos) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    } catch (e) {
      // 部分環境（如以 data: 網址開啟）禁止使用 localStorage，此時僅維持記憶體中的資料
    }
  }

  let todos = loadTodos();
  let ownerFilter = ''; // '' = 全部，UNASSIGNED = 只看未指定，其餘為 owner 名稱

  const listEl = document.getElementById('todo-list');
  const inputEl = document.getElementById('todo-input');
  const ownerInputEl = document.getElementById('owner-input');
  const ownerSuggestEl = document.getElementById('owner-suggestions');
  const ownerFilterEl = document.getElementById('owner-filter');
  const addBtn = document.getElementById('add-btn');
  const emptyHint = document.getElementById('empty-hint');
  const countText = document.getElementById('count-text');
  const clearDoneBtn = document.getElementById('clear-done-btn');

  function getOwners() {
    const set = new Set(todos.map(t => t.owner).filter(o => o));
    return Array.from(set).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
  }

  function renderOwnerControls() {
    const owners = getOwners();

    ownerSuggestEl.innerHTML = '';
    owners.forEach(o => {
      const opt = document.createElement('option');
      opt.value = o;
      ownerSuggestEl.appendChild(opt);
    });

    ownerFilterEl.innerHTML = '';
    const allOpt = document.createElement('option');
    allOpt.value = '';
    allOpt.textContent = '全部';
    ownerFilterEl.appendChild(allOpt);

    owners.forEach(o => {
      const opt = document.createElement('option');
      opt.value = o;
      opt.textContent = o;
      ownerFilterEl.appendChild(opt);
    });

    if (todos.some(t => !t.owner)) {
      const opt = document.createElement('option');
      opt.value = UNASSIGNED;
      opt.textContent = UNASSIGNED;
      ownerFilterEl.appendChild(opt);
    }

    // 若目前篩選的 owner 已不存在，退回「全部」
    const valid = Array.from(ownerFilterEl.options).some(o => o.value === ownerFilter);
    if (!valid) ownerFilter = '';
    ownerFilterEl.value = ownerFilter;
  }

  function matchesFilter(todo) {
    if (ownerFilter === '') return true;
    if (ownerFilter === UNASSIGNED) return !todo.owner;
    return todo.owner === ownerFilter;
  }

  function render() {
    renderOwnerControls();

    listEl.innerHTML = '';
    const visible = todos.filter(matchesFilter);
    emptyHint.style.display = visible.length === 0 ? 'block' : 'none';
    emptyHint.textContent = todos.length === 0 ? '目前沒有待辦事項' : '此負責人沒有待辦事項';

    visible.forEach(todo => {
      const li = document.createElement('li');
      if (todo.done) li.classList.add('done');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = todo.done;
      checkbox.addEventListener('change', () => toggleTodo(todo.id));

      const span = document.createElement('span');
      span.className = 'text';
      span.textContent = todo.text;

      const ownerBadge = document.createElement('button');
      ownerBadge.type = 'button';
      ownerBadge.className = 'owner-badge' + (todo.owner ? '' : ' unassigned');
      ownerBadge.textContent = todo.owner || UNASSIGNED;
      ownerBadge.title = '點擊修改負責人';
      ownerBadge.addEventListener('click', () => editOwner(todo.id));

      const delBtn = document.createElement('button');
      delBtn.textContent = '刪除';
      delBtn.className = 'delete-btn';
      delBtn.addEventListener('click', () => deleteTodo(todo.id));

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(ownerBadge);
      li.appendChild(delBtn);
      listEl.appendChild(li);
    });

    const doneCount = todos.filter(t => t.done).length;
    let text = `共 ${todos.length} 項，已完成 ${doneCount} 項`;
    if (ownerFilter !== '') {
      const visibleDone = visible.filter(t => t.done).length;
      text += `（篩選中：${visible.length} 項，已完成 ${visibleDone} 項）`;
    }
    countText.textContent = text;
  }

  function addTodo() {
    const text = inputEl.value.trim();
    if (!text) return;
    const owner = ownerInputEl.value.trim();
    todos.push({ id: Date.now(), text, owner, done: false });
    inputEl.value = '';
    // 保留負責人欄位內容，方便連續為同一人新增多項
    saveTodos(todos);
    render();
    inputEl.focus();
  }

  function editOwner(id) {
    const todo = todos.find(t => t.id === id);
    if (!todo) return;
    const result = window.prompt('請輸入負責人（留空表示未指定）：', todo.owner || '');
    if (result === null) return; // 使用者按取消
    todo.owner = result.trim();
    saveTodos(todos);
    render();
  }

  function toggleTodo(id) {
    const todo = todos.find(t => t.id === id);
    if (todo) todo.done = !todo.done;
    saveTodos(todos);
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    saveTodos(todos);
    render();
  }

  function clearDone() {
    todos = todos.filter(t => !t.done);
    saveTodos(todos);
    render();
  }

  addBtn.addEventListener('click', addTodo);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTodo();
  });
  ownerInputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTodo();
  });
  ownerFilterEl.addEventListener('change', () => {
    ownerFilter = ownerFilterEl.value;
    render();
  });
  clearDoneBtn.addEventListener('click', clearDone);

  render();
</script>
</body>
</html>
