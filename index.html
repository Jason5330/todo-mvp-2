<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡易待辦事項</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: #f5f5f7;
    margin: 0;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 24px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 16px;
    color: #222;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .input-row input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
  }
  .input-row button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  .input-row button:hover { background: #1d4ed8; }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid #eee;
  }
  li:last-child { border-bottom: none; }
  li span {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
  }
  li.done span {
    text-decoration: line-through;
    color: #999;
  }
  li button.delete-btn {
    border: none;
    background: transparent;
    color: #d33;
    font-size: 14px;
    cursor: pointer;
    padding: 4px 8px;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    font-size: 13px;
    color: #888;
  }
  .footer button {
    border: none;
    background: transparent;
    color: #2563eb;
    cursor: pointer;
    font-size: 13px;
  }
  .empty {
    text-align: center;
    color: #aaa;
    font-size: 14px;
    padding: 24px 0;
  }
  .dashboard {
    margin-bottom: 20px;
    padding: 16px;
    background: #fafafa;
    border-radius: 10px;
    border: 1px solid #eee;
  }
  .progress-header {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #555;
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 8px;
    background: #e5e7eb;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #34d399, #10b981);
    border-radius: 999px;
    transition: width 0.4s ease;
  }
  .flower-stage {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    height: 0;
    overflow: hidden;
    transition: height 0.4s ease;
  }
  .flower-stage.bloom {
    height: 120px;
    margin-top: 8px;
  }
  .flower-stage svg {
    width: 90px;
    height: 120px;
  }
  .flower-stage .stem {
    transform-origin: 50% 100%;
    transform: scaleY(0);
    transition: transform 0.5s ease;
  }
  .flower-stage.bloom .stem {
    transform: scaleY(1);
  }
  .flower-stage .leaf {
    opacity: 0;
    transition: opacity 0.3s ease 0.3s;
  }
  .flower-stage.bloom .leaf {
    opacity: 1;
  }
  .flower-stage .petal {
    transform: scale(0);
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  .flower-stage.bloom .petal {
    transform: scale(1);
  }
  .flower-stage.bloom .petal:nth-child(1) { transition-delay: 0.5s; }
  .flower-stage.bloom .petal:nth-child(2) { transition-delay: 0.56s; }
  .flower-stage.bloom .petal:nth-child(3) { transition-delay: 0.62s; }
  .flower-stage.bloom .petal:nth-child(4) { transition-delay: 0.68s; }
  .flower-stage.bloom .petal:nth-child(5) { transition-delay: 0.74s; }
  .flower-stage.bloom .petal:nth-child(6) { transition-delay: 0.8s; }
  .flower-stage .center {
    transform: scale(0);
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.3s ease 0.9s;
  }
  .flower-stage.bloom .center {
    transform: scale(1);
  }
</style>
</head>
<body>
  <div class="app">
    <h1>待辦事項</h1>
    <div class="dashboard">
      <div class="progress-header">
        <span id="progress-label">完成度 0%</span>
      </div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <div id="flower-stage" class="flower-stage">
        <svg viewBox="0 0 90 120" xmlns="http://www.w3.org/2000/svg">
          <path class="leaf" d="M45 100 C 25 95, 15 80, 25 68 C 38 78, 42 90, 45 100 Z" fill="#4ade80"/>
          <rect class="stem" x="42" y="55" width="6" height="55" rx="3" fill="#4ade80"/>
          <g transform="translate(45,45)">
            <ellipse class="petal" cx="0" cy="-18" rx="9" ry="16" fill="#f472b6"/>
            <ellipse class="petal" cx="15" cy="-9" rx="9" ry="16" fill="#f472b6" transform="rotate(60 0 0)"/>
            <ellipse class="petal" cx="15" cy="9" rx="9" ry="16" fill="#f472b6" transform="rotate(120 0 0)"/>
            <ellipse class="petal" cx="0" cy="18" rx="9" ry="16" fill="#f472b6" transform="rotate(180 0 0)"/>
            <ellipse class="petal" cx="-15" cy="9" rx="9" ry="16" fill="#f472b6" transform="rotate(240 0 0)"/>
            <ellipse class="petal" cx="-15" cy="-9" rx="9" ry="16" fill="#f472b6" transform="rotate(300 0 0)"/>
            <circle class="center" r="8" fill="#fbbf24"/>
          </g>
        </svg>
      </div>
    </div>
    <div class="input-row">
      <input id="todo-input" type="text" placeholder="輸入待辦事項，按 Enter 新增">
      <button id="add-btn">新增</button>
    </div>
    <ul id="todo-list"></ul>
    <div id="empty-hint" class="empty" style="display:none;">目前沒有待辦事項</div>
    <div class="footer">
      <span id="count-text">共 0 項</span>
      <button id="clear-done-btn">清除已完成</button>
    </div>
  </div>

<script>
  const STORAGE_KEY = 'todo-items';

  function loadTodos() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveTodos(todos) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    } catch (e) {
      // 部分環境（如以 data: 網址開啟）禁止使用 localStorage，此時僅維持記憶體中的資料
    }
  }

  let todos = loadTodos();

  const listEl = document.getElementById('todo-list');
  const inputEl = document.getElementById('todo-input');
  const addBtn = document.getElementById('add-btn');
  const emptyHint = document.getElementById('empty-hint');
  const countText = document.getElementById('count-text');
  const clearDoneBtn = document.getElementById('clear-done-btn');
  const progressLabel = document.getElementById('progress-label');
  const progressFill = document.getElementById('progress-fill');
  const flowerStage = document.getElementById('flower-stage');

  function render() {
    listEl.innerHTML = '';
    emptyHint.style.display = todos.length === 0 ? 'block' : 'none';

    todos.forEach(todo => {
      const li = document.createElement('li');
      if (todo.done) li.classList.add('done');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = todo.done;
      checkbox.addEventListener('change', () => toggleTodo(todo.id));

      const span = document.createElement('span');
      span.textContent = todo.text;

      const delBtn = document.createElement('button');
      delBtn.textContent = '刪除';
      delBtn.className = 'delete-btn';
      delBtn.addEventListener('click', () => deleteTodo(todo.id));

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(delBtn);
      listEl.appendChild(li);
    });

    const doneCount = todos.filter(t => t.done).length;
    countText.textContent = `共 ${todos.length} 項，已完成 ${doneCount} 項`;

    const percent = todos.length === 0 ? 0 : Math.round((doneCount / todos.length) * 100);
    progressLabel.textContent = `完成度 ${percent}%`;
    progressFill.style.width = `${percent}%`;
    flowerStage.classList.toggle('bloom', todos.length > 0 && doneCount === todos.length);
  }

  function addTodo() {
    const text = inputEl.value.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, done: false });
    inputEl.value = '';
    saveTodos(todos);
    render();
  }

  function toggleTodo(id) {
    const todo = todos.find(t => t.id === id);
    if (todo) todo.done = !todo.done;
    saveTodos(todos);
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    saveTodos(todos);
    render();
  }

  function clearDone() {
    todos = todos.filter(t => !t.done);
    saveTodos(todos);
    render();
  }

  addBtn.addEventListener('click', addTodo);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTodo();
  });
  clearDoneBtn.addEventListener('click', clearDone);

  render();
</script>
</body>
</html>
