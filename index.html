<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡易待辦事項</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: #f5f5f7;
    margin: 0;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 24px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 16px;
    color: #222;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .input-row input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
  }
  .input-row button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  .input-row button:hover { background: #1d4ed8; }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid #eee;
  }
  li:last-child { border-bottom: none; }
  li span {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
  }
  li.done span {
    text-decoration: line-through;
    color: #999;
  }
  li button.delete-btn {
    border: none;
    background: transparent;
    color: #d33;
    font-size: 14px;
    cursor: pointer;
    padding: 4px 8px;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    font-size: 13px;
    color: #888;
  }
  .footer button {
    border: none;
    background: transparent;
    color: #2563eb;
    cursor: pointer;
    font-size: 13px;
  }
  .empty {
    text-align: center;
    color: #aaa;
    font-size: 14px;
    padding: 24px 0;
  }
  .info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding: 12px 14px;
    background: #f5f7fb;
    border-radius: 10px;
  }
  .info-bar .date {
    font-size: 13px;
    color: #666;
  }
  .info-bar .clock {
    font-size: 26px;
    font-weight: 600;
    color: #222;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
    line-height: 1.2;
  }
  .info-bar .weather {
    display: flex;
    align-items: center;
    gap: 8px;
    text-align: right;
  }
  .info-bar .weather-icon {
    font-size: 28px;
    line-height: 1;
  }
  .info-bar .weather-temp {
    font-size: 18px;
    font-weight: 600;
    color: #222;
  }
  .info-bar .datetime,
  .info-bar .weather { min-width: 0; }
  .info-bar .weather-desc {
    font-size: 12px;
    color: #666;
  }
  .info-bar .weather-loading,
  .info-bar .weather-error {
    font-size: 12px;
    color: #999;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>待辦事項</h1>
    <div class="info-bar">
      <div class="datetime">
        <div id="date-text" class="date">—</div>
        <div id="clock-text" class="clock">--:--:--</div>
      </div>
      <div id="weather" class="weather">
        <span class="weather-loading">天氣載入中…</span>
      </div>
    </div>
    <div class="input-row">
      <input id="todo-input" type="text" placeholder="輸入待辦事項，按 Enter 新增">
      <button id="add-btn">新增</button>
    </div>
    <ul id="todo-list"></ul>
    <div id="empty-hint" class="empty" style="display:none;">目前沒有待辦事項</div>
    <div class="footer">
      <span id="count-text">共 0 項</span>
      <button id="clear-done-btn">清除已完成</button>
    </div>
  </div>

<script>
  const STORAGE_KEY = 'todo-items';

  function loadTodos() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveTodos(todos) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    } catch (e) {
      // 部分環境（如以 data: 網址開啟）禁止使用 localStorage，此時僅維持記憶體中的資料
    }
  }

  let todos = loadTodos();

  const listEl = document.getElementById('todo-list');
  const inputEl = document.getElementById('todo-input');
  const addBtn = document.getElementById('add-btn');
  const emptyHint = document.getElementById('empty-hint');
  const countText = document.getElementById('count-text');
  const clearDoneBtn = document.getElementById('clear-done-btn');

  function render() {
    listEl.innerHTML = '';
    emptyHint.style.display = todos.length === 0 ? 'block' : 'none';

    todos.forEach(todo => {
      const li = document.createElement('li');
      if (todo.done) li.classList.add('done');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = todo.done;
      checkbox.addEventListener('change', () => toggleTodo(todo.id));

      const span = document.createElement('span');
      span.textContent = todo.text;

      const delBtn = document.createElement('button');
      delBtn.textContent = '刪除';
      delBtn.className = 'delete-btn';
      delBtn.addEventListener('click', () => deleteTodo(todo.id));

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(delBtn);
      listEl.appendChild(li);
    });

    const doneCount = todos.filter(t => t.done).length;
    countText.textContent = `共 ${todos.length} 項，已完成 ${doneCount} 項`;
  }

  function addTodo() {
    const text = inputEl.value.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, done: false });
    inputEl.value = '';
    saveTodos(todos);
    render();
  }

  function toggleTodo(id) {
    const todo = todos.find(t => t.id === id);
    if (todo) todo.done = !todo.done;
    saveTodos(todos);
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    saveTodos(todos);
    render();
  }

  function clearDone() {
    todos = todos.filter(t => !t.done);
    saveTodos(todos);
    render();
  }

  addBtn.addEventListener('click', addTodo);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTodo();
  });
  clearDoneBtn.addEventListener('click', clearDone);

  render();

  // ===== 今日日期與時鐘 =====
  const dateText = document.getElementById('date-text');
  const clockText = document.getElementById('clock-text');
  const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];
  const pad2 = n => String(n).padStart(2, '0');

  function updateClock() {
    const now = new Date();
    dateText.textContent =
      `${now.getFullYear()} 年 ${now.getMonth() + 1} 月 ${now.getDate()} 日（週${WEEKDAYS[now.getDay()]}）`;
    clockText.textContent =
      `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ===== 今日天氣（Open-Meteo，免金鑰）=====
  const weatherEl = document.getElementById('weather');
  const DEFAULT_LOCATION = { lat: 25.0330, lon: 121.5654, name: '台北' };

  // WMO 天氣代碼 → 中文說明與圖示
  function describeWeather(code) {
    if (code === 0) return { icon: '☀️', text: '晴朗' };
    if (code === 1) return { icon: '🌤️', text: '大致晴朗' };
    if (code === 2) return { icon: '⛅', text: '局部多雲' };
    if (code === 3) return { icon: '☁️', text: '陰天' };
    if (code === 45 || code === 48) return { icon: '🌫️', text: '有霧' };
    if (code >= 51 && code <= 57) return { icon: '🌦️', text: '毛毛雨' };
    if (code >= 61 && code <= 67) return { icon: '🌧️', text: '下雨' };
    if (code >= 71 && code <= 77) return { icon: '🌨️', text: '下雪' };
    if (code >= 80 && code <= 82) return { icon: '🌧️', text: '陣雨' };
    if (code === 85 || code === 86) return { icon: '🌨️', text: '陣雪' };
    if (code >= 95) return { icon: '⛈️', text: '雷雨' };
    return { icon: '🌡️', text: '未知' };
  }

  function renderWeather(data, locationName) {
    const cur = data.current;
    const daily = data.daily;
    const { icon, text } = describeWeather(cur.weather_code);
    const hi = Math.round(daily.temperature_2m_max[0]);
    const lo = Math.round(daily.temperature_2m_min[0]);
    weatherEl.innerHTML = '';

    const iconEl = document.createElement('span');
    iconEl.className = 'weather-icon';
    iconEl.textContent = icon;

    const infoEl = document.createElement('div');
    const tempEl = document.createElement('div');
    tempEl.className = 'weather-temp';
    tempEl.textContent = `${Math.round(cur.temperature_2m)}°C`;
    const descEl = document.createElement('div');
    descEl.className = 'weather-desc';
    descEl.textContent = `${locationName}・${text}・${lo}°/${hi}°`;

    infoEl.appendChild(tempEl);
    infoEl.appendChild(descEl);
    weatherEl.appendChild(iconEl);
    weatherEl.appendChild(infoEl);
  }

  function showWeatherError() {
    weatherEl.innerHTML = '<span class="weather-error">無法取得天氣</span>';
  }

  async function fetchWeather(lat, lon, locationName) {
    const url = 'https://api.open-meteo.com/v1/forecast'
      + `?latitude=${lat}&longitude=${lon}`
      + '&current=temperature_2m,weather_code'
      + '&daily=temperature_2m_max,temperature_2m_min'
      + '&timezone=auto&forecast_days=1';
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      renderWeather(data, locationName);
    } catch (e) {
      showWeatherError();
    }
  }

  function loadWeather() {
    if (!navigator.geolocation) {
      fetchWeather(DEFAULT_LOCATION.lat, DEFAULT_LOCATION.lon, DEFAULT_LOCATION.name);
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => fetchWeather(pos.coords.latitude, pos.coords.longitude, '目前位置'),
      () => fetchWeather(DEFAULT_LOCATION.lat, DEFAULT_LOCATION.lon, DEFAULT_LOCATION.name),
      { timeout: 5000 }
    );
  }
  loadWeather();
  // 每 30 分鐘更新一次天氣
  setInterval(loadWeather, 30 * 60 * 1000);
</script>
</body>
</html>
