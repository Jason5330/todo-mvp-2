<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡易待辦事項</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: #f5f5f7;
    margin: 0;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 24px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 20px;
    margin: 0;
    color: #222;
  }
  .clock {
    text-align: right;
    line-height: 1.3;
  }
  .clock-time {
    font-size: 18px;
    font-weight: 600;
    color: #2563eb;
    font-variant-numeric: tabular-nums;
  }
  .clock-date {
    font-size: 12px;
    color: #888;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .input-row input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
  }
  .input-row button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  .input-row button:hover { background: #1d4ed8; }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid #eee;
  }
  li:last-child { border-bottom: none; }
  li span {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
  }
  li.done span {
    text-decoration: line-through;
    color: #999;
  }
  li button.delete-btn {
    border: none;
    background: transparent;
    color: #d33;
    font-size: 14px;
    cursor: pointer;
    padding: 4px 8px;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    font-size: 13px;
    color: #888;
  }
  .footer button {
    border: none;
    background: transparent;
    color: #2563eb;
    cursor: pointer;
    font-size: 13px;
  }
  .empty {
    text-align: center;
    color: #aaa;
    font-size: 14px;
    padding: 24px 0;
  }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>待辦事項</h1>
      <div class="clock" aria-live="off">
        <div id="clock-time" class="clock-time">--:--:--</div>
        <div id="clock-date" class="clock-date"></div>
      </div>
    </div>
    <div class="input-row">
      <input id="todo-input" type="text" placeholder="輸入待辦事項，按 Enter 新增">
      <button id="add-btn">新增</button>
    </div>
    <ul id="todo-list"></ul>
    <div id="empty-hint" class="empty" style="display:none;">目前沒有待辦事項</div>
    <div class="footer">
      <span id="count-text">共 0 項</span>
      <button id="clear-done-btn">清除已完成</button>
    </div>
  </div>

<script>
  const STORAGE_KEY = 'todo-items';

  function loadTodos() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveTodos(todos) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    } catch (e) {
      // 部分環境（如以 data: 網址開啟）禁止使用 localStorage，此時僅維持記憶體中的資料
    }
  }

  let todos = loadTodos();

  const listEl = document.getElementById('todo-list');
  const inputEl = document.getElementById('todo-input');
  const addBtn = document.getElementById('add-btn');
  const emptyHint = document.getElementById('empty-hint');
  const countText = document.getElementById('count-text');
  const clearDoneBtn = document.getElementById('clear-done-btn');

  function render() {
    listEl.innerHTML = '';
    emptyHint.style.display = todos.length === 0 ? 'block' : 'none';

    todos.forEach(todo => {
      const li = document.createElement('li');
      if (todo.done) li.classList.add('done');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = todo.done;
      checkbox.addEventListener('change', () => toggleTodo(todo.id));

      const span = document.createElement('span');
      span.textContent = todo.text;

      const delBtn = document.createElement('button');
      delBtn.textContent = '刪除';
      delBtn.className = 'delete-btn';
      delBtn.addEventListener('click', () => deleteTodo(todo.id));

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(delBtn);
      listEl.appendChild(li);
    });

    const doneCount = todos.filter(t => t.done).length;
    countText.textContent = `共 ${todos.length} 項，已完成 ${doneCount} 項`;
  }

  function addTodo() {
    const text = inputEl.value.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, done: false });
    inputEl.value = '';
    saveTodos(todos);
    render();
  }

  function toggleTodo(id) {
    const todo = todos.find(t => t.id === id);
    if (todo) todo.done = !todo.done;
    saveTodos(todos);
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    saveTodos(todos);
    render();
  }

  function clearDone() {
    todos = todos.filter(t => !t.done);
    saveTodos(todos);
    render();
  }

  addBtn.addEventListener('click', addTodo);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTodo();
  });
  clearDoneBtn.addEventListener('click', clearDone);

  // 時鐘：每秒更新目前時間與日期
  const clockTimeEl = document.getElementById('clock-time');
  const clockDateEl = document.getElementById('clock-date');
  const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];

  function pad(n) {
    return String(n).padStart(2, '0');
  }

  function updateClock() {
    const now = new Date();
    clockTimeEl.textContent =
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    clockDateEl.textContent =
      `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())} 星期${WEEKDAYS[now.getDay()]}`;
  }

  updateClock();
  setInterval(updateClock, 1000);

  render();
</script>
</body>
</html>
