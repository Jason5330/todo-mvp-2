<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡易待辦事項</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: #f5f5f7;
    margin: 0;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 24px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 16px;
    color: #222;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .input-row input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
  }
  .input-row button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  .input-row button:hover { background: #1d4ed8; }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid #eee;
  }
  li:last-child { border-bottom: none; }
  li span {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
  }
  li.done span {
    text-decoration: line-through;
    color: #999;
  }
  li button.delete-btn {
    border: none;
    background: transparent;
    color: #d33;
    font-size: 14px;
    cursor: pointer;
    padding: 4px 8px;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    font-size: 13px;
    color: #888;
  }
  .footer button {
    border: none;
    background: transparent;
    color: #2563eb;
    cursor: pointer;
    font-size: 13px;
  }
  .clock-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 20px;
  }
  .clock {
    width: 140px;
    height: 140px;
  }
  .clock .face {
    fill: #fff;
    stroke: #2563eb;
    stroke-width: 4;
  }
  .clock .tick {
    stroke: #bbb;
    stroke-width: 2;
    stroke-linecap: round;
  }
  .clock .tick.major {
    stroke: #555;
    stroke-width: 3;
  }
  .clock .hand {
    stroke-linecap: round;
    transform-origin: 100px 100px;
  }
  .clock .hour   { stroke: #222; stroke-width: 6; }
  .clock .minute { stroke: #444; stroke-width: 4; }
  .clock .second { stroke: #d33; stroke-width: 2; }
  .clock .center { fill: #d33; }
  .clock-digital {
    margin-top: 8px;
    font-size: 14px;
    color: #666;
    font-variant-numeric: tabular-nums;
  }
  .empty {
    text-align: center;
    color: #aaa;
    font-size: 14px;
    padding: 24px 0;
  }
</style>
</head>
<body>
  <div class="app">
    <div class="clock-wrap">
      <svg class="clock" viewBox="0 0 200 200" role="img" aria-label="時鐘">
        <circle class="face" cx="100" cy="100" r="94"/>
        <g id="clock-ticks"></g>
        <line id="hand-hour"   class="hand hour"   x1="100" y1="100" x2="100" y2="52"/>
        <line id="hand-minute" class="hand minute" x1="100" y1="100" x2="100" y2="32"/>
        <line id="hand-second" class="hand second" x1="100" y1="112" x2="100" y2="24"/>
        <circle class="center" cx="100" cy="100" r="5"/>
      </svg>
      <div id="clock-digital" class="clock-digital">--:--:--</div>
    </div>
    <h1>待辦事項</h1>
    <div class="input-row">
      <input id="todo-input" type="text" placeholder="輸入待辦事項，按 Enter 新增">
      <button id="add-btn">新增</button>
    </div>
    <ul id="todo-list"></ul>
    <div id="empty-hint" class="empty" style="display:none;">目前沒有待辦事項</div>
    <div class="footer">
      <span id="count-text">共 0 項</span>
      <button id="clear-done-btn">清除已完成</button>
    </div>
  </div>

<script>
  const STORAGE_KEY = 'todo-items';

  function loadTodos() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveTodos(todos) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    } catch (e) {
      // 部分環境（如以 data: 網址開啟）禁止使用 localStorage，此時僅維持記憶體中的資料
    }
  }

  let todos = loadTodos();

  const listEl = document.getElementById('todo-list');
  const inputEl = document.getElementById('todo-input');
  const addBtn = document.getElementById('add-btn');
  const emptyHint = document.getElementById('empty-hint');
  const countText = document.getElementById('count-text');
  const clearDoneBtn = document.getElementById('clear-done-btn');

  function render() {
    listEl.innerHTML = '';
    emptyHint.style.display = todos.length === 0 ? 'block' : 'none';

    todos.forEach(todo => {
      const li = document.createElement('li');
      if (todo.done) li.classList.add('done');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = todo.done;
      checkbox.addEventListener('change', () => toggleTodo(todo.id));

      const span = document.createElement('span');
      span.textContent = todo.text;

      const delBtn = document.createElement('button');
      delBtn.textContent = '刪除';
      delBtn.className = 'delete-btn';
      delBtn.addEventListener('click', () => deleteTodo(todo.id));

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(delBtn);
      listEl.appendChild(li);
    });

    const doneCount = todos.filter(t => t.done).length;
    countText.textContent = `共 ${todos.length} 項，已完成 ${doneCount} 項`;
  }

  function addTodo() {
    const text = inputEl.value.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, done: false });
    inputEl.value = '';
    saveTodos(todos);
    render();
  }

  function toggleTodo(id) {
    const todo = todos.find(t => t.id === id);
    if (todo) todo.done = !todo.done;
    saveTodos(todos);
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    saveTodos(todos);
    render();
  }

  function clearDone() {
    todos = todos.filter(t => !t.done);
    saveTodos(todos);
    render();
  }

  addBtn.addEventListener('click', addTodo);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTodo();
  });
  clearDoneBtn.addEventListener('click', clearDone);

  // ---- 圓形時鐘 ----
  (function initClock() {
    const ticksEl = document.getElementById('clock-ticks');
    for (let i = 0; i < 60; i++) {
      const major = i % 5 === 0;
      const angle = (i * 6) * Math.PI / 180;
      const r1 = major ? 78 : 84;
      const r2 = 90;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', 100 + r1 * Math.sin(angle));
      line.setAttribute('y1', 100 - r1 * Math.cos(angle));
      line.setAttribute('x2', 100 + r2 * Math.sin(angle));
      line.setAttribute('y2', 100 - r2 * Math.cos(angle));
      line.setAttribute('class', major ? 'tick major' : 'tick');
      ticksEl.appendChild(line);
    }

    const hourHand = document.getElementById('hand-hour');
    const minuteHand = document.getElementById('hand-minute');
    const secondHand = document.getElementById('hand-second');
    const digitalEl = document.getElementById('clock-digital');

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      const now = new Date();
      const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
      hourHand.style.transform = `rotate(${(h % 12) * 30 + m * 0.5}deg)`;
      minuteHand.style.transform = `rotate(${m * 6 + s * 0.1}deg)`;
      secondHand.style.transform = `rotate(${s * 6}deg)`;
      digitalEl.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
    }

    tick();
    setInterval(tick, 1000);
  })();

  render();
</script>
</body>
</html>
